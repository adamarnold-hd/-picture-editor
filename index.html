<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片字幕生成器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #f4f4f6;
      --card-bg: #ffffff;
      --text: #202124;
      --muted: #8a8d93;
      --border: #e8e9ec;
      --input-border: #d4d7dd;
      --primary: #1677e6;
      --primary-hover: #0f67ca;
      --success: #34c759;
      --preview-bg: #f3f3f5;
      --shadow: 0 10px 32px rgba(20, 24, 32, 0.08);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      width: min(1600px, calc(100% - 48px));
      margin: 0 auto;
      padding: 52px 0 48px;
    }

    h1 {
      margin: 0 0 58px;
      text-align: center;
      font-size: 36px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }

    h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
    }

    h3 {
      margin: 0 0 28px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 800;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 230, 0.12);
    }

    input[type="number"],
    select {
      height: 52px;
      padding: 0 44px 0 16px;
      font-size: 20px;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #8a8d93 50%),
        linear-gradient(135deg, #8a8d93 50%, transparent 50%);
      background-position:
        calc(100% - 25px) 22px,
        calc(100% - 19px) 22px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      padding: 18px;
      font-size: 20px;
      line-height: 1.45;
    }

    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(420px, 680px) minmax(520px, 1fr);
      gap: 40px;
      align-items: start;
    }

    .card {
      overflow: hidden;
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .panel-section {
      padding: 34px 28px;
      border-bottom: 1px solid var(--border);
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .upload-zone {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 176px;
      height: 60px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .upload-button:hover {
      background: var(--primary-hover);
    }

    .upload-button:active {
      transform: translateY(1px);
    }

    .upload-plus {
      font-size: 32px;
      line-height: 1;
      font-weight: 300;
    }

    .file-name {
      min-height: 24px;
      color: var(--muted);
      font-size: 18px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 28px;
    }

    .input-with-unit {
      position: relative;
    }

    .unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 20px;
      pointer-events: none;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 54px;
    }

    input[type="color"] {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      padding: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 8px;
    }

    .hex-value {
      color: var(--muted);
      font-size: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .primary-button,
    .secondary-button {
      height: 64px;
    }

    .primary-button {
      background: var(--primary);
      color: #fff;
    }

    .primary-button:hover {
      background: var(--primary-hover);
    }

    .secondary-button {
      border: 1px solid var(--input-border);
      background: #fff;
      color: var(--text);
    }

    .secondary-button:hover {
      border-color: #b9bdc5;
      background: #fafafa;
    }

    .preview-card {
      padding: 34px 28px 28px;
    }

    .preview-shell {
      margin-top: 30px;
      min-height: 840px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--preview-bg);
      overflow: hidden;
    }

    .preview-placeholder {
      width: 100%;
      min-height: 840px;
      background: var(--preview-bg);
    }

    canvas {
      display: none;
      max-width: 100%;
      max-height: 840px;
      height: auto;
      object-fit: contain;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      min-width: 280px;
      max-width: calc(100% - 48px);
      padding: 18px 28px;
      border-radius: 10px;
      background: #2f3542;
      color: #fff;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(15, 20, 28, 0.18);
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.success {
      background: var(--success);
    }

    @media (max-width: 1100px) {
      .page {
        width: min(760px, calc(100% - 32px));
        padding-top: 36px;
      }

      h1 {
        margin-bottom: 32px;
        font-size: 30px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .preview-shell,
      .preview-placeholder {
        min-height: 520px;
      }

      canvas {
        max-height: 520px;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 24px, 560px);
        padding: 28px 0;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 24px;
      }

      h3 {
        font-size: 21px;
      }

      .panel-section,
      .preview-card {
        padding: 26px 20px;
      }

      .control-grid,
      .actions {
        grid-template-columns: 1fr;
      }

      .preview-shell,
      .preview-placeholder {
        min-height: 360px;
      }

      canvas {
        max-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>图片字幕生成器</h1>

    <div class="layout">
      <section class="card" aria-label="图片字幕生成设置">
        <div class="panel-section">
          <h3>上传图片</h3>
          <div class="upload-zone">
            <label class="upload-button" for="imageInput">
              <span class="upload-plus">+</span>
              <span>选择图片</span>
            </label>
            <input class="file-input" id="imageInput" type="file" accept="image/jpeg,image/png,image/webp">
            <div class="file-name" id="fileName">未选择图片</div>
          </div>
        </div>

        <div class="panel-section">
          <h3>字幕设置</h3>
          <div class="control-grid">
            <div>
              <label for="captionHeight">字幕高度</label>
              <div class="input-with-unit">
                <input id="captionHeight" type="number" min="1" step="1" value="80" inputmode="numeric">
                <span class="unit">px</span>
              </div>
            </div>

            <div>
              <label for="fontSize">字体大小</label>
              <div class="input-with-unit">
                <input id="fontSize" type="number" min="1" step="1" value="40" inputmode="numeric">
                <span class="unit">px</span>
              </div>
            </div>

            <div>
              <label for="fontColor">字体颜色</label>
              <div class="color-row">
                <input id="fontColor" type="color" value="#ffffff">
                <span class="hex-value" id="fontColorValue">#FFFFFF</span>
              </div>
            </div>

            <div>
              <label for="outlineColor">轮廓颜色</label>
              <div class="color-row">
                <input id="outlineColor" type="color" value="#000000">
                <span class="hex-value" id="outlineColorValue">#000000</span>
              </div>
            </div>

            <div>
              <label for="fontFamily">字体样式</label>
              <select id="fontFamily">
                <option value="Microsoft YaHei" selected>微软雅黑</option>
                <option value="SimHei">黑体</option>
                <option value="SimSun">宋体</option>
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="sans-serif">sans-serif</option>
              </select>
            </div>

            <div>
              <label for="fontWeight">字体粗细</label>
              <select id="fontWeight">
                <option value="normal" selected>正常</option>
                <option value="700">加粗</option>
              </select>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>字幕内容</h3>
          <textarea id="captionText">这是Manus的相关照片
也是一个历史性的时刻
Manus不一定会笑到最后
但世界已经因此开始发生一些变化</textarea>
        </div>

        <div class="panel-section">
          <div class="actions">
            <button class="primary-button" id="generateButton" type="button">生成字幕图片</button>
            <button class="secondary-button" id="saveButton" type="button">保存图片</button>
          </div>
        </div>
      </section>

      <section class="card preview-card" aria-label="预览">
        <h2>预览</h2>
        <div class="preview-shell">
          <div class="preview-placeholder" id="previewPlaceholder"></div>
          <canvas id="previewCanvas"></canvas>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const fileName = document.getElementById("fileName");
    const captionHeightInput = document.getElementById("captionHeight");
    const fontSizeInput = document.getElementById("fontSize");
    const fontColorInput = document.getElementById("fontColor");
    const outlineColorInput = document.getElementById("outlineColor");
    const fontColorValue = document.getElementById("fontColorValue");
    const outlineColorValue = document.getElementById("outlineColorValue");
    const fontFamilyInput = document.getElementById("fontFamily");
    const fontWeightInput = document.getElementById("fontWeight");
    const captionTextInput = document.getElementById("captionText");
    const generateButton = document.getElementById("generateButton");
    const saveButton = document.getElementById("saveButton");
    const previewPlaceholder = document.getElementById("previewPlaceholder");
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    const toast = document.getElementById("toast");

    const validTypes = new Set(["image/jpeg", "image/png", "image/webp"]);
    const minFontSize = 16;
    const sidePaddingRatio = 0.06;
    let sourceImage = null;
    let generated = false;
    let toastTimer = null;

    function normalizeHex(value) {
      return value.toUpperCase();
    }

    function showToast(message, type = "info") {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast show ${type === "success" ? "success" : ""}`;
      toastTimer = window.setTimeout(() => {
        toast.className = "toast";
      }, 2200);
    }

    function getPositiveInteger(input, fallback) {
      const value = Number.parseInt(input.value, 10);
      if (Number.isFinite(value) && value > 0) {
        return value;
      }

      input.value = String(fallback);
      return fallback;
    }

    function getCaptionLines() {
      return captionTextInput.value
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function getSettings() {
      return {
        captionHeight: getPositiveInteger(captionHeightInput, 80),
        fontSize: getPositiveInteger(fontSizeInput, 40),
        fontColor: fontColorInput.value,
        outlineColor: outlineColorInput.value,
        fontFamily: fontFamilyInput.value,
        fontWeight: fontWeightInput.value,
        lines: getCaptionLines()
      };
    }

    function setCanvasVisibility(visible) {
      canvas.style.display = visible ? "block" : "none";
      previewPlaceholder.style.display = visible ? "none" : "block";
    }

    function setCanvasSizeFromImage() {
      canvas.width = sourceImage.naturalWidth;
      canvas.height = sourceImage.naturalHeight;
    }

    function getFontDeclaration(size, settings) {
      return `${settings.fontWeight} ${size}px "${settings.fontFamily}", sans-serif`;
    }

    function fitTextToWidth(text, maxWidth, settings) {
      let size = settings.fontSize;
      ctx.font = getFontDeclaration(size, settings);

      while (size > minFontSize && ctx.measureText(text).width > maxWidth) {
        size -= 1;
        ctx.font = getFontDeclaration(size, settings);
      }

      if (ctx.measureText(text).width <= maxWidth) {
        return { text, size };
      }

      let clipped = text;
      while (clipped.length > 1 && ctx.measureText(`${clipped}...`).width > maxWidth) {
        clipped = clipped.slice(0, -1);
      }

      return { text: `${clipped}...`, size };
    }

    function drawCaptions(settings) {
      const { lines, captionHeight } = settings;
      const totalCaptionHeight = lines.length * captionHeight;
      const startY = Math.max(0, canvas.height - totalCaptionHeight);
      const maxTextWidth = canvas.width * (1 - sidePaddingRatio * 2);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";

      lines.forEach((line, index) => {
        const y = startY + index * captionHeight;
        const textY = y + captionHeight / 2;
        const fitted = fitTextToWidth(line, maxTextWidth, settings);

        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(0, y, canvas.width, captionHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        ctx.fillRect(0, y, canvas.width, 1);

        ctx.font = getFontDeclaration(fitted.size, settings);
        ctx.lineWidth = Math.max(3, Math.round(fitted.size * 0.08));
        ctx.strokeStyle = settings.outlineColor;
        ctx.fillStyle = settings.fontColor;
        ctx.strokeText(fitted.text, canvas.width / 2, textY);
        ctx.fillText(fitted.text, canvas.width / 2, textY);
      });
    }

    function renderCanvas(options = {}) {
      if (!sourceImage) {
        setCanvasVisibility(false);
        return false;
      }

      const settings = getSettings();
      if (options.requireText && settings.lines.length === 0) {
        showToast("请输入字幕内容");
        return false;
      }

      setCanvasSizeFromImage();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);

      if (settings.lines.length > 0) {
        drawCaptions(settings);
      }

      setCanvasVisibility(true);
      generated = settings.lines.length > 0;
      return generated;
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) {
        return;
      }

      if (!validTypes.has(file.type)) {
        imageInput.value = "";
        showToast("图片格式不支持");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          sourceImage = image;
          fileName.textContent = file.name;
          generated = false;
          renderCanvas();
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function handleGenerate() {
      if (!sourceImage) {
        showToast("请先上传图片");
        return;
      }

      if (renderCanvas({ requireText: true })) {
        showToast("字幕图片生成成功！", "success");
      }
    }

    function handleSave() {
      if (!sourceImage) {
        showToast("请先上传图片");
        return;
      }

      if (!generated && !renderCanvas({ requireText: true })) {
        return;
      }

      canvas.toBlob((blob) => {
        if (!blob) {
          showToast("保存图片失败");
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "caption-image.png";
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }, "image/png");
    }

    function handleSettingChange() {
      fontColorValue.textContent = normalizeHex(fontColorInput.value);
      outlineColorValue.textContent = normalizeHex(outlineColorInput.value);
      generated = false;
      renderCanvas();
    }

    imageInput.addEventListener("change", handleImageUpload);
    generateButton.addEventListener("click", handleGenerate);
    saveButton.addEventListener("click", handleSave);

    [
      captionHeightInput,
      fontSizeInput,
      fontColorInput,
      outlineColorInput,
      fontFamilyInput,
      fontWeightInput,
      captionTextInput
    ].forEach((control) => {
      control.addEventListener("input", handleSettingChange);
      control.addEventListener("change", handleSettingChange);
    });

    fontColorValue.textContent = normalizeHex(fontColorInput.value);
    outlineColorValue.textContent = normalizeHex(outlineColorInput.value);
    setCanvasVisibility(false);
  </script>
</body>
</html>
